      /* ============================================================
   JOBS UI CONTROLLER
   ============================================================ */
      const jobsUI = {
        filtered: JOBS,
        savedIds: data.getSaved(),

        search() {
          const keyword = (
            document.getElementById("searchKeyword")?.value || ""
          )
            .toLowerCase()
            .trim();
          const location = (
            document.getElementById("searchLocation")?.value || ""
          )
            .toLowerCase()
            .trim();
          const types = [
            ...document.querySelectorAll(".filter-type:checked"),
          ].map((i) => i.value);
          const levels = [
            ...document.querySelectorAll(".filter-level:checked"),
          ].map((i) => i.value);
          const locations = [
            ...document.querySelectorAll(".filter-location:checked"),
          ].map((i) => i.value);
          const sort = document.getElementById("sortSelect")?.value || "recent";

          let results = JOBS.filter((job) => {
            const matchesKeyword =
              !keyword ||
              job.title.toLowerCase().includes(keyword) ||
              job.company.toLowerCase().includes(keyword) ||
              job.tags.some((t) => t.toLowerCase().includes(keyword));
            const matchesLocation =
              !location || job.location.toLowerCase().includes(location);
            const matchesType = types.length === 0 || types.includes(job.type);
            const matchesLevel =
              levels.length === 0 || levels.includes(job.level);
            const matchesLocFilter =
              locations.length === 0 || locations.includes(job.location);
            return (
              matchesKeyword &&
              matchesLocation &&
              matchesType &&
              matchesLevel &&
              matchesLocFilter
            );
          });

          if (sort === "salary-high") {
            results.sort(
              (a, b) =>
                parseInt(b.salary.replace(/\D/g, "")) -
                parseInt(a.salary.replace(/\D/g, "")),
            );
          } else if (sort === "salary-low") {
            results.sort(
              (a, b) =>
                parseInt(a.salary.replace(/\D/g, "")) -
                parseInt(b.salary.replace(/\D/g, "")),
            );
          } else if (sort === "applicants") {
            results.sort((a, b) => a.applicants - b.applicants);
          }

          this.filtered = results;
          this.render();
        },

        render() {
          const list = document.getElementById("jobsList");
          const count = document.getElementById("resultsCount");
          if (!list) return;

          count.innerHTML = `Showing <strong>${this.filtered.length}</strong> job${this.filtered.length !== 1 ? "s" : ""}`;

          if (this.filtered.length === 0) {
            list.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
          <h3>No jobs match your criteria</h3>
          <p>Try adjusting your filters or search keywords.</p>
          <button class="btn btn-primary" onclick="jobsUI.clearFilters()">Clear Filters</button>
        </div>
      `;
            return;
          }

          list.innerHTML = this.filtered
            .map((j) => this.renderCard(j))
            .join("");
        },

        renderCard(job) {
          const isSaved = this.savedIds.includes(job.id);
          return `
      <div class="job-card" onclick="jobsUI.openJob(${job.id})">
        <div class="job-card-top">
          <div class="job-logo" style="background:${job.companyColor};">${job.companyInitial}</div>
          <div class="job-main">
            <h3 class="job-title">${job.title}</h3>
            <div class="job-company">
              <i class="fa-solid fa-building"></i> ${job.company}
              <span class="job-dot">•</span>
              <i class="fa-solid fa-location-dot"></i> ${job.location}
              <span class="job-dot">•</span>
              <i class="fa-regular fa-clock"></i> ${job.posted}
            </div>
          </div>
          <div class="job-salary">${job.salary}</div>
        </div>
        <p class="job-description">${job.description}</p>
        <div class="job-tags">
          <span class="tag tag-primary">${job.type}</span>
          <span class="tag tag-warning">${job.level}</span>
          ${job.tags.map((t) => `<span class="tag">${t}</span>`).join("")}
        </div>
        <div class="job-card-bottom">
          <div class="job-meta">
            <span><i class="fa-solid fa-users"></i> ${job.applicants} applicants</span>
            <span><i class="fa-solid fa-circle-check"></i> Actively hiring</span>
          </div>
          <div class="job-actions">
            <button class="bookmark-btn ${isSaved ? "saved" : ""}" onclick="event.stopPropagation();jobsUI.toggleSave(${job.id}, this)" aria-label="Save job">
              <i class="fa-${isSaved ? "solid" : "regular"} fa-bookmark"></i>
            </button>
            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();jobsUI.openJob(${job.id})">View Details</button>
          </div>
        </div>
      </div>
    `;
        },

        attach() {
          this.render();
        },

        clearFilters() {
          document
            .querySelectorAll(".filter-type, .filter-level, .filter-location")
            .forEach((i) => (i.checked = false));
          document.getElementById("searchKeyword").value = "";
          document.getElementById("searchLocation").value = "";
          this.search();
        },

        toggleSave(id, btn) {
          const saved = data.toggleSaved(id);
          this.savedIds = saved;
          if (btn) {
            const isSaved = saved.includes(id);
            btn.classList.toggle("saved", isSaved);
            btn.innerHTML = `<i class="fa-${isSaved ? "solid" : "regular"} fa-bookmark"></i>`;
          }
        },

        openJob(id) {
          const job = JOBS.find((j) => j.id === id);
          if (!job) return;

          document.getElementById("modalJobTitle").textContent = job.title;
          document.getElementById("modalJobCompany").innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
        <div class="job-logo" style="width:32px;height:32px;font-size:13px;background:${job.companyColor};">${job.companyInitial}</div>
        <span>${job.company} · ${job.location} · ${job.type}</span>
      </div>
    `;

          document.getElementById("modalJobBody").innerHTML = `
      <div class="job-tags" style="margin-bottom:20px;">
        <span class="tag tag-primary">${job.type}</span>
        <span class="tag tag-warning">${job.level} Level</span>
        ${job.tags.map((t) => `<span class="tag">${t}</span>`).join("")}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;padding:16px;background:var(--bg-muted);border-radius:var(--radius);">
        <div>
          <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:4px;">Salary</div>
          <div style="font-size:14px;font-weight:700;color:var(--success);">${job.salary}</div>
        </div>
        <div>
          <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:4px;">Applicants</div>
          <div style="font-size:14px;font-weight:700;">${job.applicants}</div>
        </div>
        <div>
          <div style="font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:4px;">Posted</div>
          <div style="font-size:14px;font-weight:700;">${job.posted}</div>
        </div>
      </div>
      <div class="detail-section">
        <h3><i class="fa-solid fa-align-left"></i> About the Role</h3>
        <p>${job.description}</p>
      </div>
      <div class="detail-section">
        <h3><i class="fa-solid fa-list-check"></i> Requirements</h3>
        <ul>${job.requirements.map((r) => `<li>${r}</li>`).join("")}</ul>
      </div>
      <div class="detail-section">
        <h3><i class="fa-solid fa-gift"></i> Benefits</h3>
        <ul>${job.benefits.map((b) => `<li>${b}</li>`).join("")}</ul>
      </div>
    `;

          document.getElementById("modalApplyBtn").onclick = () => {
            modal.close("jobModal");
            this.openApply(job);
          };

          modal.open("jobModal");
        },

        openApply(job) {
          const profile = data.getProfile();
          document.getElementById("applyJobTitle").textContent =
            `${job.title} at ${job.company}`;
          document.getElementById("applyName").value =
            profile.name || auth.user?.name || "";
          document.getElementById("applyEmail").value =
            profile.email || auth.user?.email || "";
          document.getElementById("applyCover").value = "";
          document.getElementById("applyResumeName").textContent =
            "Click to upload your resume";

          document.getElementById("applyModal").dataset.jobId = job.id;
          modal.open("applyModal");
        },
      };

      /* ============================================================
   PROFILE UI CONTROLLER
   ============================================================ */
      const profileUI = {
        attach() {},

        handleCVUpload(e) {
          const file = e.target.files[0];
          if (!file) return;
          if (file.type !== "application/pdf") {
            toast.show("Please upload a PDF file", "error");
            return;
          }
          if (file.size > 10 * 1024 * 1024) {
            toast.show("File must be under 10MB", "error");
            return;
          }

          document.getElementById("cvFileInfo").innerHTML = `
      <div class="cv-file-info">
        <i class="fa-solid fa-file-pdf"></i>
        <div style="flex:1;">
          <div class="file-name">${file.name}</div>
          <div class="file-size">${(file.size / 1024).toFixed(1)} KB</div>
        </div>
        <i class="fa-solid fa-circle-check" style="color:var(--success);"></i>
      </div>
    `;

          // Parse PDF
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              const pdf = await pdfjsLib.getDocument(reader.result).promise;
              let text = "";
              for (let i = 1; i <= Math.min(pdf.numPages, 5); i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map((item) => item.str).join(" ") + "\n";
              }

              // Extract skills (simple keyword matching)
              const SKILL_KEYWORDS = [
                "JavaScript",
                "Python",
                "React",
                "Node.js",
                "SQL",
                "AWS",
                "Docker",
                "Figma",
                "Agile",
                "Java",
                "C#",
                "Vue",
                "Angular",
                "Kubernetes",
                "Communication",
                "Leadership",
                "Analytics",
                "Excel",
                "SAP",
                "Salesforce",
                "HTML",
                "CSS",
                "TypeScript",
                "Git",
                "MongoDB",
                "PostgreSQL",
                "REST",
                "GraphQL",
                "Linux",
                "Windows",
                "Azure",
                "GCP",
                "Machine Learning",
                "Data Science",
                "Marketing",
                "Sales",
                "Design",
                "Photoshop",
                "Illustrator",
              ];
              const lower = text.toLowerCase();
              const found = SKILL_KEYWORDS.filter((k) =>
                lower.includes(k.toLowerCase()),
              );

              const profile = data.getProfile();
              profile.cvText = text.slice(0, 5000);
              profile.cvFileName = file.name;
              profile.skills = [
                ...new Set([...(profile.skills || []), ...found]),
              ];
              data.setProfile(profile);

              toast.show(`CV parsed! Found ${found.length} skills.`, "success");
              router.go("profile");
            } catch (err) {
              console.error(err);
              toast.show("Error parsing PDF. Please try again.", "error");
            }
          };
          reader.readAsDataURL(file);
        },

        addSkill() {
          const input = document.getElementById("newSkill");
          const val = input.value.trim();
          if (!val) return;
          const profile = data.getProfile();
          profile.skills = profile.skills || [];
          if (profile.skills.includes(val)) {
            toast.show("Skill already added", "warning");
            return;
          }
          profile.skills.push(val);
          data.setProfile(profile);
          input.value = "";
          router.go("profile");
          toast.show("Skill added", "success");
        },

        removeSkill(skill) {
          const profile = data.getProfile();
          profile.skills = (profile.skills || []).filter((s) => s !== skill);
          data.setProfile(profile);
          router.go("profile");
        },

        editProfile() {
          const name = prompt(
            "Enter your full name:",
            data.getProfile().name || auth.user?.name || "",
          );
          if (name) {
            const profile = data.getProfile();
            profile.name = name;
            data.setProfile(profile);
            if (auth.user) {
              auth.user.name = name;
              auth.login(auth.user);
            }
            router.go("profile");
            toast.show("Profile updated", "success");
          }
        },
      };

      /* ============================================================
   HANDLERS
   ============================================================ */
      function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!email || !password) {
          toast.show("Please fill in all fields", "error");
          return;
        }

        const profile = data.getProfile();
        auth.login({
          name: profile.name || email.split("@")[0],
          email,
          id: "user-" + Date.now(),
        });
        toast.show(`Welcome back, ${auth.user.name}!`, "success");
        router.go("dashboard");
      }

      function handleSignup(e) {
        e.preventDefault();
        const name = document.getElementById("signupName").value.trim();
        const surname = document.getElementById("signupSurname").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const phone = document.getElementById("signupPhone").value.trim();
        const id = document.getElementById("signupId").value.trim();
        const password = document.getElementById("signupPassword").value;
        const confirm = document.getElementById("signupConfirm").value;

        let valid = true;

        // Email
        if (!validate.email(email)) {
          document.getElementById("signupEmailError").classList.add("visible");
          document.getElementById("signupEmail").classList.add("invalid");
          valid = false;
        } else {
          document
            .getElementById("signupEmailError")
            .classList.remove("visible");
          document.getElementById("signupEmail").classList.remove("invalid");
        }

        // Phone
        if (!validate.phone(phone)) {
          document.getElementById("signupPhoneError").classList.add("visible");
          document.getElementById("signupPhone").classList.add("invalid");
          valid = false;
        } else {
          document
            .getElementById("signupPhoneError")
            .classList.remove("visible");
          document.getElementById("signupPhone").classList.remove("invalid");
        }

        // ID
        if (!validate.saId(id)) {
          document.getElementById("signupIdError").classList.add("visible");
          document.getElementById("signupId").classList.add("invalid");
          valid = false;
        } else {
          document.getElementById("signupIdError").classList.remove("visible");
          document.getElementById("signupId").classList.remove("invalid");
        }

        // Password
        const strength = validate.passwordStrength(password);
        if (strength.score < 3) {
          toast.show(
            "Password is too weak. Use 8+ chars with mix of cases, numbers & symbols.",
            "error",
          );
          valid = false;
        }

        // Confirm
        if (password !== confirm) {
          document
            .getElementById("signupConfirmError")
            .classList.add("visible");
          document.getElementById("signupConfirm").classList.add("invalid");
          valid = false;
        } else {
          document
            .getElementById("signupConfirmError")
            .classList.remove("visible");
          document.getElementById("signupConfirm").classList.remove("invalid");
        }

        if (!valid) return;

        const profile = data.getProfile();
        profile.name = `${name} ${surname}`;
        profile.email = email;
        profile.phone = phone;
        profile.idNumber = id;
        data.setProfile(profile);

        auth.login({ name: profile.name, email, id: "user-" + Date.now() });
        toast.show("Account created! Welcome to CvBot.", "success");
        router.go("dashboard");
      }

      function handleForgot(e) {
        e.preventDefault();
        const input = document.getElementById("forgotInput").value.trim();
        if (!input) {
          toast.show("Please enter your email or ID", "error");
          return;
        }
        toast.show("Verification code sent to your email", "success");
        router.go("forgot", { step: 2, target: input });
        // Attach OTP auto-advance after render
        setTimeout(() => {
          document.querySelectorAll(".otp-input").forEach((inp, idx, arr) => {
            inp.addEventListener("input", () => {
              if (inp.value && idx < arr.length - 1) arr[idx + 1].focus();
              inp.classList.toggle("filled", !!inp.value);
            });
            inp.addEventListener("keydown", (e) => {
              if (e.key === "Backspace" && !inp.value && idx > 0)
                arr[idx - 1].focus();
            });
            inp.addEventListener("paste", (e) => {
              e.preventDefault();
              const text = e.clipboardData.getData("text").replace(/\D/g, "");
              arr.forEach((f, i) => {
                if (text[i]) {
                  f.value = text[i];
                  f.classList.add("filled");
                }
              });
              if (text.length >= 4) arr[3].focus();
            });
          });
          document.querySelector(".otp-input")?.focus();
          startResendTimer();
        }, 50);
      }

      function verifyOTP(target) {
        const inputs = [...document.querySelectorAll(".otp-input")];
        const code = inputs.map((i) => i.value).join("");
        if (code.length !== 4) {
          document.getElementById("otpError").classList.add("visible");
          toast.show("Please enter the full 4-digit code", "error");
          return;
        }
        // For demo, accept any code
        toast.show("Code verified!", "success");
        router.go("forgot", { step: 3 });
      }

      let resendInterval;
      function startResendTimer() {
        let seconds = 30;
        const btn = document.getElementById("resendBtn");
        const timer = document.getElementById("resendTimer");
        if (!btn || !timer) return;
        btn.disabled = true;
        clearInterval(resendInterval);
        resendInterval = setInterval(() => {
          seconds--;
          timer.textContent = ` (${seconds}s)`;
          if (seconds <= 0) {
            clearInterval(resendInterval);
            btn.disabled = false;
            timer.textContent = "";
          }
        }, 1000);
      }

      function resendOTP() {
        toast.show("New code sent!", "success");
        startResendTimer();
      }

      function handleResetPassword(e) {
        e.preventDefault();
        const np = document.getElementById("newPassword").value;
        const cp = document.getElementById("confirmNewPassword").value;
        if (np.length < 8) {
          toast.show("Password must be at least 8 characters", "error");
          return;
        }
        if (np !== cp) {
          toast.show("Passwords do not match", "error");
          return;
        }
        toast.show("Password reset successfully! Please sign in.", "success");
        router.go("login");
      }

      function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
        } else {
          input.type = "password";
          btn.innerHTML = '<i class="fa-regular fa-eye"></i>';
        }
      }

      function toggleUserMenu(e) {
        if (e) e.stopPropagation();
        document.getElementById("userDropdown").classList.toggle("open");
      }

      function toggleMobileMenu() {
        const nav = document.getElementById("mobileNav");
        nav.style.display = nav.style.display === "none" ? "block" : "none";
      }

      function submitApplication() {
        const jobId = parseInt(
          document.getElementById("applyModal").dataset.jobId,
        );
        const name = document.getElementById("applyName").value.trim();
        const email = document.getElementById("applyEmail").value.trim();

        if (!name || !email) {
          toast.show("Please fill in your name and email", "error");
          return;
        }
        if (!validate.email(email)) {
          toast.show("Please enter a valid email", "error");
          return;
        }

        if (data.addApp({ jobId, name, email })) {
          toast.show("Application submitted successfully! 🎉", "success");
          modal.close("applyModal");
          setTimeout(() => router.go("applications"), 800);
        }
      }

      // Password strength meter
      document.addEventListener("input", (e) => {
        if (e.target.id === "signupPassword") {
          const { score } = validate.passwordStrength(e.target.value);
          const bars = document.querySelectorAll("#pwStrength .bar");
          const text = document.getElementById("pwStrengthText");
          bars.forEach((bar, i) => {
            bar.classList.remove("active", "weak", "medium", "strong");
            if (i < score) {
              bar.classList.add("active");
              bar.classList.add(
                score <= 2 ? "weak" : score <= 3 ? "medium" : "strong",
              );
            }
          });
          if (text) {
            text.textContent = !e.target.value
              ? "Use 8+ characters with a mix of letters, numbers & symbols"
              : score <= 2
                ? "Weak password"
                : score <= 3
                  ? "Medium password"
                  : score <= 4
                    ? "Strong password"
                    : "Very strong password";
          }
        }
      });

      // Click outside to close user menu
      document.addEventListener("click", (e) => {
        const menu = document.getElementById("userDropdown");
        if (menu && !e.target.closest(".user-menu")) {
          menu.classList.remove("open");
        }
      });

      // ESC closes modals
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") modal.closeAll();
      });

      // Initialize
      theme.init();
      auth.init();
      window.addEventListener("DOMContentLoaded", () => {
        if (auth.user) {
          router.go("dashboard");
        } else {
          router.go("login");
        }
      });
    </script>
  </body>
</html>
